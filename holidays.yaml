## 配置说明

### 节日类型

**1. 固定日期：**
```yaml
christmas:
  date: "2026-12-25"  # 直接写日期
```

**2. 固定算法：**
```yaml
black_friday:
  fixed_rule: "november_fourth_friday"  # 系统自动计算
```

**3. 需要手动更新：**
```yaml
prime_day:
  date: ""  # 等公布后手动填写
  announcement_check_start: "2026-07-01"  # 从这天开始提醒你查公告
```

### 重要程度

| 等级 | 说明 | 提前天数 | 提醒频率 |
|-----|------|---------|---------|
| 5 | 最重要（黑五/Prime Day） | 提前一周 | 每天提醒 |
| 4 | 很重要（圣诞节） | 提前一周 | 每周末提醒 |
| 3 | 重要 | 提前3天 | 一次提醒 |
| 2 | 一般（独立日） | 提前1天 | 一次提醒 |
| 1 | 可选 | 当天 | 一次提醒 |

---

## 维护指南

### 每年更新（1月）

1. 更新年份：把所有 2026 改成 2027
2. 清空 Prime Day 日期：`date: ""`
3. 更新可计算日期的年份

### Prime Day 日期公布后

1. 编辑 holidays.yaml
2. 找到 prime_day 部分
3. 填写日期：`date: "2026-07-15"`
4. 保存

### 添加新节日

复制现有节日的配置，修改参数即可。
